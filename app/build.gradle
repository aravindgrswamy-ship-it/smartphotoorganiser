plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.smartgallery'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.smartgallery"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Phones only: keeps the APK smaller (no x86 emulator libraries).
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // On-device AI. Models are bundled, nothing is uploaded anywhere.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
